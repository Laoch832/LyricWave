name: CI

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this version as Laoch832 after all checks (main or version tag only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish == true && 'release' || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.publish != true }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should-build: ${{ steps.release-plan.outputs.should-build }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release request and avoid duplicate tag builds
        id: release-plan
        env:
          GH_TOKEN: ${{ github.token }}
          AMPP_PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 scripts/ci/release.py plan
      - name: Verify source contracts and Python tests
        run: |
          python3 scripts/verify-glass-reference.py
          python3 scripts/verify-architecture.py
          python3 scripts/verify-profile-data.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Validate workflow syntax and expressions
        run: bash scripts/ci/check-workflows.sh

  android:
    name: Android tests, lint and builds
    needs: checks
    if: needs.checks.outputs.should-build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the exact Android toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Fingerprint independent plugin example and SDK
        id: plugin-inputs
        run: echo "key=$(python3 scripts/build-plugin-example.py --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Cache independent plugin example and SDK
        id: plugin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/plugin-example
          key: ${{ runner.os }}-${{ runner.arch }}-plugin-example-v1-${{ steps.plugin-inputs.outputs.key }}
      - name: Build or reuse independent plugin fixture
        env:
          CACHE_HIT: ${{ steps.plugin-cache.outputs.cache-hit }}
        run: |
          chmod +x gradlew
          if [ "$CACHE_HIT" != 'true' ] || [ ! -s build/plugin-example/basic-plugin.zip ] || [ ! -s build/plugin-example/ampp-plugin-api-v1.jar ]; then
            python3 scripts/build-plugin-example.py
          fi
      - name: Run all unit tests, lint and assemble both variants
        run: |
          ./gradlew test :app:lintDebug :app:lintVitalRelease :glass:lintDebug :host-applemusic:lintDebug :plugin-api:lintDebug :plugin-runtime:lintDebug :app:assembleDebug :app:assembleRelease -PpluginFixture="$PWD/build/plugin-example/basic-plugin.zip" --no-daemon --stacktrace
      - name: Package unsigned release with source metadata
        run: python3 scripts/ci/release.py prepare
      - name: Upload unsigned release for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AM-plus-plus-unsigned
          path: dist/unsigned/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AM-plus-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload plugin SDK and example
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AM-plus-plus-plugin-sdk-v1
          path: build/plugin-example/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test and lint reports even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14

  sign:
    name: Verify and sign APK
    needs: android
    if: >-
      github.repository == 'Laoch832/AM-plus-plus-custom' &&
      github.event_name != 'pull_request' &&
      github.actor == 'Laoch832' && github.triggering_actor == 'Laoch832' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the same source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up APK signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'build-tools;37.0.0'
      - name: Download only the unsigned build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AM-plus-plus-unsigned
          path: dist/unsigned
      - name: Sign, verify certificate and create checksums
        env:
          AMPP_RELEASE_KEYSTORE_BASE64: ${{ secrets.AMPP_RELEASE_KEYSTORE_BASE64 }}
          AMPP_RELEASE_STORE_PASSWORD: ${{ secrets.AMPP_RELEASE_STORE_PASSWORD }}
          AMPP_RELEASE_KEY_ALIAS: ${{ secrets.AMPP_RELEASE_KEY_ALIAS }}
          AMPP_RELEASE_KEY_PASSWORD: ${{ secrets.AMPP_RELEASE_KEY_PASSWORD }}
          AMPP_SIGNING_CERT_SHA256: ${{ vars.AMPP_SIGNING_CERT_SHA256 }}
        run: python3 scripts/ci/release.py sign
      - name: Upload installable APK and verification records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AM-plus-plus-signed
          path: dist/signed/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish as Laoch832
    needs: sign
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - name: Check out the same source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the verified signed build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AM-plus-plus-signed
          path: dist/signed
      - name: Verify personal identity and publish a new immutable version
        env:
          GH_TOKEN: ${{ secrets.AMPP_PUBLISH_TOKEN }}
          AMPP_SIGNING_CERT_SHA256: ${{ vars.AMPP_SIGNING_CERT_SHA256 }}
        run: python3 scripts/ci/release.py publish --input dist/signed
